name: Publish initial website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor == 'vincent-he-0525' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare the personal website address
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          homepage = Path('index.html').read_text()
          previous = re.search(r'<link rel="canonical" href="([^"]+)"', homepage).group(1)
          current = 'https://vincent-he-0525.github.io/'
          for path in [*Path('.').glob('*.html'), Path('robots.txt'), Path('sitemap.xml')]:
              text = path.read_text().replace(previous, current)
              if path.name == '404.html':
                  text = re.sub(r'<base href="[^"]+">', '<base href="/">', text)
              path.write_text(text)
          PY
      - name: Publish a standalone initial version
        env:
          GIT_AUTHOR_NAME: Vincent He
          GIT_AUTHOR_EMAIL: 341765163+vincent-he-0525@users.noreply.github.com
          GIT_COMMITTER_NAME: Vincent He
          GIT_COMMITTER_EMAIL: 341765163+vincent-he-0525@users.noreply.github.com
        run: |
          set -eu
          git add --all
          publication_tree=$(git write-tree)
          publication_commit=$(printf 'Publish Vincent He personal website\n' | git commit-tree "$publication_tree")
          git push --force-with-lease="refs/heads/main:$GITHUB_SHA" origin "$publication_commit:refs/heads/main"
